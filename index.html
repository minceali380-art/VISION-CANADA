<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISION-CANADA</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .container{
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            max-width: 500px;
            margin: auto;
        }

        h1{
            color: #0077cc;
        }

        p{
            font-size: 18px;
        }

        button{
            background: #0077cc;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background: #005fa3;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Bienvenue sur VISION-CANADA</h1>

        <p>

</html>
